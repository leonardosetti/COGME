  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Macro-Fases, Marcos e Estrutura Analítica do Projeto</text>
  <text x="640" y="65" text-anchor="middle" font-size="14" fill="#555555">EAP: 12 fases de Nível 1 + 37 pacotes de Nível 2 | 5 Marcos oficiais</text>
