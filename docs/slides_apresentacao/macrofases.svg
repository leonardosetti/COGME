  <text x="410" y="360" text-anchor="middle" font-size="10" fill="#E67E22">⏳ Em andamento</text>
  <rect x="540" y="280" width="200" height="90" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2" stroke-dasharray="4,2"/>
