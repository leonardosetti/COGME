[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogme-sddai-cli"
version = "1.0.0"
description = "Interface de linha de comando unificada para o pipeline SDDAI (custom do zero)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cogme-sddai = "cogme_sddai_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cogme_sddai_cli*"]