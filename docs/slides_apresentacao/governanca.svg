<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1F3A5F"/>
    </marker>
    <marker id="ar-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2E7D32"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Modelo de Governança Híbrida Trifásico</text>
  <!-- Camada 1: PMBOK 7 -->
  <rect x="240" y="75" width="800" height="110" rx="8" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/>
  <text x="640" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">PMBOK® 7ª Edição — Governança Primária</text>
  <text x="640" y="140" text-anchor="middle" font-size="14" fill="#E0E7EF">12 Princípios + 8 Domínios de Desempenho</text>
  <text x="640" y="165" text-anchor="middle" font-size="13" font-style="italic" fill="#E0E7EF">Define o POR QUÊ e o PARA QUÊ — decisões orientadas por valor</text>
  <line x1="640" y1="185" x2="640" y2="215" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ar)"/>
  <text x="660" y="205" font-size="11" fill="#555555">Autoridade Normativa</text>
  <!-- Camada 2: PMBOK 6 -->
  <rect x="240" y="220" width="800" height="110" rx="8" fill="#F8F9FA" stroke="#546E7A" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="640" y="255" text-anchor="middle" font-size="20" font-weight="bold" fill="#37474F">PMBOK® 6ª Edição — Dicionário Complementar</text>
  <text x="640" y="285" text-anchor="middle" font-size="14" fill="#555555">Processos citados apenas para rastreabilidade acadêmica</text>
  <text x="640" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">⚠ Obsolescência Assumida para Métricas Preditivas (EVM, SPI, CPI)</text>
  <line x1="640" y1="330" x2="640" y2="360" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ar)"/>
  <text x="660" y="350" font-size="11" fill="#555555">Vocabulário Estrutural</text>
  <!-- Camada 3: Kanban -->
  <rect x="240" y="365" width="800" height="110" rx="8" fill="#2E7D32" stroke="#2E7D32" stroke-width="2"/>
  <text x="640" y="400" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Manifesto Ágil + Kanban (GitHub Projects)</text>
  <text x="640" y="430" text-anchor="middle" font-size="14" fill="#E8F5E9">Fluxo Contínuo, Pull System, WIP Limits, Métricas de Fluxo</text>
  <text x="640" y="455" text-anchor="middle" font-size="13" font-style="italic" fill="#E8F5E9">Define o COMO — SSOT: fonte única de verdade</text>
  <!-- Seta de realimentação -->
  <path d="M 1040 420 Q 1160 420 1160 250 Q 1160 130 1040 130" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#ar-green)"/>
  <text x="1175" y="275" font-size="12" font-weight="bold" fill="#2E7D32" text-anchor="start">Lições</text>
  <text x="1175" y="292" font-size="12" font-weight="bold" fill="#2E7D32" text-anchor="start">Aprendidas</text>
  <!-- Trade-offs -->
  <rect x="80" y="510" width="1120" height="180" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="640" y="540" text-anchor="middle" font-size="16" font-weight="bold" fill="#E65100">Trade-offs Declarados e Separação Ontológica</text>
  <text x="280" y="575" text-anchor="middle" font-size="13" fill="#333333">✓ Velocidade decisória</text>
  <text x="280" y="595" text-anchor="middle" font-size="11" fill="#555555">GP = CCB único (P7)</text>
  <text x="640" y="575" text-anchor="middle" font-size="13" fill="#333333">✓ Fluxo contínuo</text>
  <text x="640" y="595" text-anchor="middle" font-size="11" fill="#555555">em vez de sprints</text>
  <text x="1000" y="575" text-anchor="middle" font-size="13" fill="#333333">✓ Valor sobre burocracia</text>
  <text x="1000" y="595" text-anchor="middle" font-size="11" fill="#555555">Princípio GMV</text>
  <line x1="120" y1="625" x2="1160" y2="625" stroke="#E65100" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="640" y="655" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">Premissa P9 — Separação Ontológica:</text>
  <text x="640" y="678" text-anchor="middle" font-size="13" fill="#333333">TAP AUTORIZA (congelado) ≠ EAP DECOMPÕE ≠ Planos/Código EXECUTAM (PDCA)</text>
</svg>