adr-016-ratificada: 'ADR-016 (Backend do MVP: cálculo, cotações, persistência e contrato
  de erro) ratificada definitivamente em 05/11/2026 pelo GP/CCB (instrumento RAT-2026-11-05-A16).
  Versão 1.1.0, status ratificada. Decisões D1-D12 norma vigente: D1 spread/IOF informados
  pelo usuário; D2 ordem de cálculo (IOF após spread); D3 ROUND_HALF_EVEN; D4 somente
  cotações persistidas; D5 Frankfurter primária/PTAX reserva; D6 cache sem idade máxima
  com stale=true; D7 timeout 0.9s/circuit breaker; D8 aceite Decimal 0<taxa<1000;
  D9 contrato de erro padronizado; D10 routers/common.py; D11 Python 3.11/3.12 pendência
  não-bloqueante; D12 rede interna sem CORS. Aderente à entrega funcional de 16/11/2026.
  Pendências P1-P8 não bloqueiam a entrega. Propagado para ADR-LOG (ADR-LOG-009),
  spec-006 (NF-25), spec-009 (UAT-03), lista-specs-pendentes (E.2 fechado).'
codigo-camadas-separadas: 'Camadas Dados/Back/Front separadas e proxy sempre ativo
  (commit abc7350, 05/11/2026). docker-compose.yml: db+migrate+back+front+proxy; back
  na rede data+edge, front na edge, db/migrate so na data; proxy sempre ativo em 127.0.0.1:8080
  roteando / para front e /v1/ para back; sem CORS. front.conf serve src/frontend/templates
  e proxa /v1/* para back:8000. index.html era 0 B, agora tela de simulacao funcional
  chamando POST /v1/simulate pela mesma origem. docker compose config EXIT 0. Fecha
  bloqueante de codigo da separacao de camadas (spec-005, US-018). Coerente com ADR-016
  (RAT-2026-11-05-A16).'
