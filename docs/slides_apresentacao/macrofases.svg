  <text x="640" y="342" text-anchor="middle" font-size="11" fill="#333333">de métricas de fluxo</text>
  <text x="640" y="360" text-anchor="middle" font-size="10" fill="#E65100">(auxiliar)</text>
  <rect x="760" y="280" width="220" height="90" rx="6" fill="#F8F9FA" stroke="#1F3A5F" stroke-width="2"/>
  <text x="870" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3A5F">M3 — 15/11</text>
  <text x="870" y="325" text-anchor="middle" font-size="11" fill="#333333">MVP Funcional</text>
  <text x="870" y="342" text-anchor="middle" font-size="11" fill="#333333">Beta + Coverage ≥80%</text>
  <text x="870" y="360" text-anchor="middle" font-size="10" fill="#555555">UAT aprovado</text>
