# Stack do COGME (ADR-010): db + migrate + back + front + proxy.
# Camadas ortogonais (Constituição Art. 10.1): cada serviço constrói, versiona
# e reinicia independentemente; comunicação apenas por interface declarada.
#
#   docker compose up --build   # todas as camadas (proxy sempre ativo)
#   docker compose restart back # reinicia só o back, sem tocar front/db
#
# Todas as portas do host ficam presas em 127.0.0.1.

name: cogme

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: cogme-back:local
  environment: &app-env
    COGME_DATABASE_URL: ${COGME_DATABASE_URL:?defina COGME_DATABASE_URL no .env}
    COGME_RATE_TTL_SECONDS: ${COGME_RATE_TTL_SECONDS:-3600}
    COGME_PROVIDER_TIMEOUT_SECONDS: ${COGME_PROVIDER_TIMEOUT_SECONDS:-0.9}
    COGME_LOG_LEVEL: ${COGME_LOG_LEVEL:-INFO}
  networks: [data, edge]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - cogme_pgdata:/var/lib/postgresql/data
    # Porta 5432 exposta em 127.0.0.1 apenas para testes locais fora do Docker.
    # Em produção/CI o banco é alcançável apenas pela rede interna `data`.
    ports:
      - "127.0.0.1:5432:5432"
    networks: [data, edge]
    # `edge` (não-interna) só para permitir o published port 127.0.0.1:5432 no host
    # (testes locais fora do Docker). A rede `data` continua interna e isolada;
    # back e migrate alcançam o db pela `data` via DNS do serviço.
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Migração de esquema: mesma imagem do back, roda e termina antes do back iniciar.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    # Só fala com o banco: sem a rede `edge`, não tem saída para a internet.
    networks: [data]
    mem_limit: 256m
    pids_limit: 100
    depends_on:
      db:
        condition: service_healthy

  # Camada Back: API FastAPI/Uvicorn /v1. Não publica porta no host (acesso só via proxy/front).
  back:
    <<: *app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    # WeasyPrint chega a ~250 MB de RSS sob carga; 768m deixa folga sem deixar crescer sem fim.
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Camada Front: FastAPI com Jinja2 — renderiza templates server-side e faz proxy /v1/* para back:8000.
  front:
    build:
      context: .
      dockerfile: Dockerfile
    image: cogme-back:local
    restart: unless-stopped
    command: ["uvicorn", "src.frontend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      COGME_DATABASE_URL: ${COGME_DATABASE_URL:?defina COGME_DATABASE_URL no .env}
      COGME_RATE_TTL_SECONDS: ${COGME_RATE_TTL_SECONDS:-3600}
      COGME_PROVIDER_TIMEOUT_SECONDS: ${COGME_PROVIDER_TIMEOUT_SECONDS:-0.9}
      COGME_LOG_LEVEL: ${COGME_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8001:8000"
    networks: [edge]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reverse proxy sempre ativo (não mais profile opcional): entrada única do usuário em 127.0.0.1:8080.
  proxy:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    restart: unless-stopped
    depends_on:
      front:
        condition: service_healthy
      back:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  # Interna: sem rota para a internet. Só db, migrate e back participam.
  data:
    internal: true
  # Saída para os provedores de cotação (Frankfurter, PTAX) e entrada do proxy.
  edge: {}

volumes:
  cogme_pgdata: {}
