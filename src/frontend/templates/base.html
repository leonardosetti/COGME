<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}COGME{% endblock %}</title>
<meta name="description" content="COGME - Simulador de Recebimento em Moeda Estrangeira. Calcule valores líquidos após spread, IOF e conversão cambial com cotações oficiais.">
<link rel="stylesheet" href="/static/css/app-ifit.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23166534' stroke-width='2'%3E%3Cpath d='M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'/%3E%3Cpath d='M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z'/%3E%3C/svg%3E">
</head>
<body>
<!-- Skip link for keyboard users -->
<a href="#main-content" class="skip-link">Pular para conteúdo principal</a>

{% include '_navbar.html' %}

<main id="main-content" class="container">
  {% block content %}{% endblock %}
</main>

{% include '_footer.html' %}

<script>
(function () {
  var navAnon = document.getElementById('nav-anon');
  var navUser = document.getElementById('nav-user');
  var navUserItems = document.querySelectorAll('#nav-user-dashboard,#nav-user-perfil,#nav-user-clientes');
  if (!navAnon || !navUser) return;

  function getCookie(name) {
    var match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
    return match ? match[1] : null;
  }

  function setAuthenticated(authed) {
    if (authed) {
      navAnon.classList.add('hidden');
      navUser.classList.remove('hidden');
      navUserItems.forEach(function (el) { el.classList.remove('hidden'); });
    } else {
      navAnon.classList.remove('hidden');
      navUser.classList.add('hidden');
      navUserItems.forEach(function (el) { el.classList.add('hidden'); });
    }
  }

  fetch('/v1/auth/me', { credentials: 'include' }).then(function (res) {
    setAuthenticated(res.ok);
  }).catch(function () {
    setAuthenticated(false);
  });

  var logout = document.getElementById('nav-logout');
  if (logout) {
    logout.addEventListener('click', function (e) {
      e.preventDefault();
      fetch('/v1/auth/logout', {
        method: 'POST',
        credentials: 'include',
        headers: { 'X-CSRF-Token': getCookie('csrf_token') || '' }
      }).then(function () {
        location.reload();
      });
    });
  }
})();
</script>

{% block scripts %}{% endblock %}
</body>
</html>
