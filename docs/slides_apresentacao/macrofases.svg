  <text x="680" y="155" text-anchor="middle" font-size="12" fill="#E8F5E9">01/10 — 15/11/2026</text>
  <text x="680" y="178" text-anchor="middle" font-size="11" fill="#E8F5E9">4 fases | 12 pacotes</text>
  <text x="680" y="198" text-anchor="middle" font-size="11" fill="#E8F5E9">N5, N6, N7, N10</text>
  <line x1="870" y1="155" x2="900" y2="155" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ar-flow)"/>
  <polygon points="920,140 940,155 920,170 900,155" fill="#E67E22" stroke="#E67E22" stroke-width="2"/>
  <text x="920" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#E67E22">M3</text>
  <text x="920" y="210" text-anchor="middle" font-size="10" fill="#555555">15/11</text>
  <rect x="940" y="100" width="280" height="110" rx="8" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="2"/>
