# Stack do COGME (ADR-010): db + migrate + web, e proxy opcional.
# Segredos vêm do `.env` (copie de .env.example). Nada sensível neste arquivo.
#
#   docker compose up --build                  # db + migrate + web
#   docker compose --profile proxy up --build  # inclui o nginx
#
# Todas as portas do host ficam presas em 127.0.0.1.

name: cogme

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: cogme-web:local
  environment: &app-env
    COGME_DATABASE_URL: ${COGME_DATABASE_URL:?defina COGME_DATABASE_URL no .env}
    COGME_RATE_TTL_SECONDS: ${COGME_RATE_TTL_SECONDS:-3600}
    COGME_PROVIDER_TIMEOUT_SECONDS: ${COGME_PROVIDER_TIMEOUT_SECONDS:-0.9}
    COGME_LOG_LEVEL: ${COGME_LOG_LEVEL:-INFO}
  networks: [data, edge]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - cogme_pgdata:/var/lib/postgresql/data
    # Sem `ports`: o banco só é alcançável pela rede interna `data`.
    networks: [data]
    # Sem `cap_drop: [ALL]`: o entrypoint do Postgres troca de usuário (chown/su-exec) e
    # precisa de CHOWN, SETUID, SETGID, DAC_OVERRIDE e FOWNER. Fica o padrão do Docker.
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Migração de esquema: mesma imagem do web, roda e termina antes do web iniciar.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    # Só fala com o banco: sem a rede `edge` (herdada do anchor), não tem saída para a internet.
    networks: [data]
    mem_limit: 256m
    pids_limit: 100
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: [/tmp]
    # WeasyPrint chega a ~250 MB de RSS sob carga; 768m deixa folga sem deixar crescer sem fim.
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Reverse proxy latente: só sobe com `--profile proxy`.
  proxy:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    # O master do nginx roda como root e troca os workers para o usuário `nginx`:
    # CHOWN (diretórios temporários), SETUID e SETGID. A porta 80 não exige NET_BIND_SERVICE
    # (o Docker libera portas baixas no namespace do contêiner).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    mem_limit: 128m
    pids_limit: 64

networks:
  # Interna: sem rota para a internet. Só db, migrate e web participam.
  data:
    internal: true
  # Saída para os provedores de cotação (Frankfurter, PTAX) e entrada do proxy.
  edge: {}

volumes:
  cogme_pgdata: {}
