  <text x="240" y="178" text-anchor="middle" font-size="11" fill="#E0E7EF">6 fases | 20 pacotes</text>
  <text x="240" y="198" text-anchor="middle" font-size="11" fill="#E0E7EF">N1, N2, N3, N4, N8, N9</text>
  <line x1="420" y1="155" x2="450" y2="155" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ar-flow)"/>
