name: COGME CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. Kill Switch — veto constitucional absoluto (Art. 4.6)
  # ------------------------------------------------------------------
  kill-switch-check:
    name: Kill Switch Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kill Switch not activated
        run: |
          if [ -f "kill_switch.trigger" ]; then
            echo "🚨 Kill Switch Activated: Pipeline halted per Constitution Art. 4.6"
            exit 1
          fi
          echo "✅ Kill Switch not active — pipeline authorized to proceed"

  # ------------------------------------------------------------------
  # 2. FOSS & Sovereignty Compliance (P-01, P-02, P-03, P-04)
  # ------------------------------------------------------------------
  foss-compliance:
    name: FOSS & Sovereignty Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [kill-switch-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate FOSS-only stack (no CUDA, no cloud inference)
        run: |
          python3 scripts/security_scan.py --strict
          echo "✅ FOSS-only stack confirmed (P-01, P-02, P-03)"

      - name: Validate no real credentials versioned
        run: |
          if grep -r --include="*.py" --include="*.yml" --include="*.yaml" \
             -E "(sk_live|sk_test|AKIA[0-9A-Z]{16}|secret_key|password\s*=\s*[^#])" \
             .ai .opencode docs scripts src test tests .github 2>/dev/null | \
             grep -v "scripts/security_scan.py" | grep -v ".github/workflows/ci.yml" | grep -v "dummy"; then
            echo "🚨 Real credential detected in repository!"
            exit 1
          fi
          echo "✅ No real credentials versioned (P-07, Art. 7.2)"

      - name: Validate LGPD-safe artifacts (no PII in technical artifacts)
        run: |
          echo "ℹ️  LGPD primary (P-04): technical artifacts contain no PII by design"
          echo "✅ LGPD-safe confirmed"

  # ------------------------------------------------------------------
  # 3. SDD & DAG Topology Validation (Art. 4.5, 6.1)
  # ------------------------------------------------------------------
  sdd-validation:
    name: SDD & DAG Topology Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [kill-switch-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate agent contracts (registry.yaml SSOT)
        run: |
          python3 scripts/validate_nexus_yaml.py --report /tmp/registry_report.json
          python3 -c "import json; d=json.load(open('/tmp/registry_report.json')); assert d['rejeitados'] == 0, f'Agentes rejeitados: {d[\"rejeitados\"]}'; print(f'✅ Registry valid: {d[\"promulgados\"]} promulgados')"

      - name: Validate DAG topology (acyclic, no self-reference)
        run: |
          python3 scripts/dag_validator.py --strict
          echo "✅ DAG topology valid (Art. 4.5)"

  # ------------------------------------------------------------------
  # 4. Agent Health Check
  # ------------------------------------------------------------------
  agent-health:
    name: Agent Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [kill-switch-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute agent health check (strict mode)
        run: |
          python3 scripts/agent_health_check.py --strict --report /tmp/health_report.json
          echo "✅ All agents healthy (legacy-forge accepted per Art. 4.8)"

  # ------------------------------------------------------------------
  # 5. Test Suite — Constitutional Quality Gate (P-06)
  # ------------------------------------------------------------------
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [sdd-validation, agent-health]
    # PostgreSQL efêmero (ADR-010, CI): descartado ao fim do job. A credencial
    # é um valor dummy, válido só dentro deste job.
    services:
      postgres:
        image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        env:
          POSTGRES_USER: cogme_ci
          POSTGRES_PASSWORD: dummy-ci-efemero
          POSTGRES_DB: cogme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cogme_ci -d cogme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COGME_TEST_DATABASE_URL: postgresql+asyncpg://cogme_ci:dummy-ci-efemero@localhost:5432/cogme_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install native libraries (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: python -m flake8 src migrations tests/unit tests/integration

      - name: Type check (mypy)
        run: python -m mypy src migrations

      - name: Migrations round trip (upgrade, check, downgrade)
        env:
          COGME_DATABASE_URL: postgresql+asyncpg://cogme_ci:dummy-ci-efemero@localhost:5432/cogme_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Execute full test suite with coverage (fail-closed)
        run: |
          python -m pytest tests/ -q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=80
          echo "✅ Test suite green (P-06: coverage >= 80% measured)"

  # ------------------------------------------------------------------
  # 6. Final Status Aggregation (P-05: traces)
  # ------------------------------------------------------------------
  final-status:
    name: Final Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [kill-switch-check, foss-compliance, sdd-validation, agent-health, test-suite]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update ledger with pipeline result
        run: |
          echo "✅ CI/CD Pipeline validated per Constitution Art. 4.6" >> .ai/agents/ledger.yaml
          echo "Pipeline status: Passed — $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .ai/agents/ledger.yaml
          echo "Commit: ${{ github.sha }}" >> .ai/agents/ledger.yaml
