<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}COGME{% endblock %}</title>
<meta name="description" content="COGME - Simulador de Recebimento em Moeda Estrangeira. Calcule valores líquidos após spread, IOF e conversão cambial com cotações oficiais.">

<!-- Fonts: IBM Plex Sans (preconnect for performance) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F59E0B' stroke-width='2'%3E%3Cpath d='M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'/%3E%3Cpath d='M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z'/%3E%3C/svg%3E">
</head>
<body>
<!-- Skip link for keyboard users -->
<a href="#main-content" class="skip-link">Pular para conteúdo principal</a>

<header class="site-header">
  <div class="wrap">
    <h1><a href="/">COGME</a></h1>
    <nav>
      <a href="/">Simulador</a>
      <a href="/invoice">Emitir invoice</a>
    </nav>
  </div>
</header>

<main id="main-content" class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="notice">{% block notice %}{% endblock %}</p>
    <p class="attribution" role="contentinfo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z"/></svg>
      Projeto desenvolvido para a disciplina de Gerenciamento de Projetos - FATEC 2026/2
    </p>
  </div>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
