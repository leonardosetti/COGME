[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogme"
version = "0.1.0"
description = "COGME - simulador de recebimento em moeda estrangeira (backend do MVP)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "jinja2>=3.1,<4",
    "weasyprint>=70,<71",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "flake8>=7.5,<8",
    "mypy>=2.4,<3",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: requer PostgreSQL real (COGME_TEST_DATABASE_URL).",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true
