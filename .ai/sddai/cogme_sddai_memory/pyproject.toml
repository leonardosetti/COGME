[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogme-sddai-memory"
version = "1.0.0"
description = "Otimização de memória para SDDAI (custom do zero)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cogme-sddai-memory = "cogme_sddai_memory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cogme_sddai_memory*"]