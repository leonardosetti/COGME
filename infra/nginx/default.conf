# Proxy reverso do COGME (ADR-010, Constituição Art. 10.1).
# Sempre ativo (não mais profile opcional): entrada única do usuário em
# 127.0.0.1:8080. Roteia / para o front e /v1/ para o back, sem expor
# nenhuma camada diretamente ao host. Sem CORS: mesma origem (spec-004 §7).
# Mínimo para HTTP; TLS fica para quando houver certificado e domínio.

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Interface de usuário: servida pela camada front.
    location / {
        proxy_pass http://front:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # API: encaminhada para a camada back.
    location /v1/ {
        proxy_pass http://back:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
