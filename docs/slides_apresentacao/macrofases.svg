  <text x="1110" y="342" text-anchor="middle" font-size="11" fill="#333333">+ Aceite Acadêmico</text>
  <text x="1110" y="360" text-anchor="middle" font-size="10" fill="#555555">Tag de release</text>
  <!-- Status M1 -->
  <rect x="60" y="410" width="1160" height="280" rx="8" fill="#F4F6F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="640" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3A5F">Status do Marco M1 — Entregues</text>
  <text x="220" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">✅ TAP v3</text>
  <text x="220" y="495" text-anchor="middle" font-size="11" fill="#333333">Aprovado + congelado</text>
  <text x="220" y="512" text-anchor="middle" font-size="11" fill="#333333">(desde 18/09)</text>
  <text x="460" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">✅ 5 Planos</text>
  <text x="460" y="495" text-anchor="middle" font-size="11" fill="#333333">Integração, Escopo,</text>
  <text x="460" y="512" text-anchor="middle" font-size="11" fill="#333333">Cronograma, Custos, Qualidade</text>
  <text x="700" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">✅ 4 ADRs</text>
  <text x="700" y="495" text-anchor="middle" font-size="11" fill="#333333">Stack, Kanban,</text>
  <text x="700" y="512" text-anchor="middle" font-size="11" fill="#333333">Métricas, Tasklists</text>
  <text x="940" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">✅ SSOT Configurado</text>
  <text x="940" y="495" text-anchor="middle" font-size="11" fill="#333333">27 labels | 5 milestones</text>
  <text x="940" y="512" text-anchor="middle" font-size="11" fill="#333333">21 cards M1</text>
  <line x1="100" y1="540" x2="1180" y2="540" stroke="#1F3A5F" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="220" y="570" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">✅ EAP Canônica</text>
  <text x="220" y="590" text-anchor="middle" font-size="11" fill="#333333">12 fases + 37 pacotes</text>
  <text x="460" y="570" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">✅ 12 PDCAs</text>
  <text x="460" y="590" text-anchor="middle" font-size="11" fill="#333333">+ 3 Ishikawa 6M</text>
  <text x="700" y="570" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">✅ Equipe</text>
  <text x="700" y="590" text-anchor="middle" font-size="11" fill="#333333">≤ 20h/semana por membro</text>
  <text x="700" y="607" text-anchor="middle" font-size="11" fill="#333333">(Premissa P5)</text>
  <text x="940" y="570" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">✅ Backlog Priorizado</text>
  <text x="940" y="590" text-anchor="middle" font-size="11" fill="#333333">15 must + 6 should</text>
  <text x="940" y="607" text-anchor="middle" font-size="11" fill="#333333">P0–P3 + MoSCoW</text>
  <text x="640" y="665" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">Paralelismo integral dentro de cada Macro-Fase — Kanban pull system (não sequencial)</text>
</svg>