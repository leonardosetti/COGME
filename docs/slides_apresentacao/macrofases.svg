  <text x="470" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#E67E22">M2</text>
  <text x="470" y="210" text-anchor="middle" font-size="10" fill="#555555">30/09</text>
  <rect x="490" y="100" width="380" height="110" rx="8" fill="#2E7D32" stroke="#2E7D32" stroke-width="2"/>
