# Camada Front do COGME (ADR-010 / spec-005 §3.1).
# Serve arquivos estáticos de src/frontend/ (montado em /usr/share/nginx/html)
# e encaminha /v1/* para o back na rede interna do compose.
# Sem CORS: mesma origem via proxy (spec-004 §7).

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Arquivos estáticos (HTML, CSS, JS) da camada front.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Encaminha a API para o back (mesma origem via proxy, sem CORS).
    location /v1/ {
        proxy_pass http://back:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
