<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}COGME{% endblock %}</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>:focus-visible { outline: 2pt solid #1c1c1c; outline-offset: 2pt; }</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1><a href="/">COGME</a></h1>
    <nav>
      <a href="/">Simulador</a>
      <a href="/invoice">Emitir invoice</a>
    </nav>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p id="notice" class="notice">{% block notice %}{% endblock %}</p>
  </div>
</footer>

<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
