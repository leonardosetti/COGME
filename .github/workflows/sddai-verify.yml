name: SDDAI Verify Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: SDDAI Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Kill Switch not activated
        run: |
          if [ -f "kill_switch.trigger" ]; then
            echo "🚨 Kill Switch Activated: SDDAI Verify halted per Constitution Art. 4.6"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest

      - name: Execute SDDAI Verify Pipeline (fail-closed, strict)
        run: |
          python3 scripts/sddai_verify_pipeline.py --strict
          echo "✅ SDDAI Verify Pipeline green — all 7 steps passed"
