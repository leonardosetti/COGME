[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogme-sddai-loader"
version = "1.0.0"
description = "Carregamento e ingestão de dados de entrada para SDDAI (custom do zero)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cogme-sddai-loader = "cogme_sddai_loader.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cogme_sddai_loader*"]