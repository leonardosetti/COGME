name: Auditoria de Compliance

on:
  schedule:
    # Disparo a cada 90 minutos (16x/dia), 24/7.
    # Cron nao expressa "cada 90 min" em uma linha: usa duas versoes
    # que se intercalam (0:00, 1:30, 3:00, ... 22:30).
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias (FOSS + dev para auditoria)
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt
      - name: Executar auditoria de compliance (fail-closed)
        run: python3 scripts/auditoria_compliance.py --report
