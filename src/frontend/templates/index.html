{% extends "base.html" %}

{% block title %}COGME — Conversor Cambial{% endblock %}

{% block content %}
<form id="form" action="/simulate" method="post" novalidate>
  <div class="grid">
    <div>
      <label>Moeda</label>
      <select id="currency" name="currency">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
      </select>
    </div>
    <div>
      <label>Regime de contratação</label>
      <select id="regime" name="regime">
        <option value="hourly">Hora</option>
        <option value="daily">Dia</option>
        <option value="weekly">Semana</option>
        <option value="monthly">Mês</option>
        <option value="fixed">Valor fixo</option>
      </select>
    </div>
    <div>
      <label>Valor por unidade (BRL)</label>
      <input type="number" id="amount" name="amount" step="0.01" min="0" value="30" required>
    </div>
    <div id="qty-wrap">
      <label>Quantidade de unidades</label>
      <input type="number" id="quantity" name="quantity" step="1" min="1" value="160" required>
    </div>
    <div>
      <label>Spread (%)</label>
      <input type="number" id="spread_pct" name="spread_pct" step="0.0001" min="0" max="100" value="2" required>
    </div>
    <div>
      <label>IOF (%)</label>
      <input type="number" id="iof_pct" name="iof_pct" step="0.0001" min="0" max="100" value="0.38" required>
    </div>
  </div>
  <div id="error" class="error"></div>
  <button type="submit" id="btn">Simular</button>
</form>

<div id="result">
  <div class="card">
    <div class="row"><span class="lbl">Moeda estrangeira</span><span class="val" id="r-gross-foreign"></span></div>
    <div class="row"><span class="lbl">Bruto em BRL</span><span class="val" id="r-gross-brl"></span></div>
    <div class="row"><span class="lbl">Spread</span><span class="val" id="r-spread-brl"></span></div>
    <div class="row"><span class="lbl">IOF</span><span class="val" id="r-iof-brl"></span></div>
    <div class="row total"><span class="lbl">Líquido a receber</span><span class="val" id="r-net-brl"></span></div>
    <div class="row"><span class="lbl">Cotação efetiva</span><span class="val" id="r-effective-rate"></span></div>
    <div class="row"><span class="lbl">Fonte</span><span class="val" id="r-source"></span></div>
  </div>
  <div id="stale" class="stale"></div>
  <div class="notice" id="notice"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    var form = document.getElementById('form');
    var btn = document.getElementById('btn');
    var error = document.getElementById('error');
    var result = document.getElementById('result');
    var qtyWrap = document.getElementById('qty-wrap');
    var stale = document.getElementById('stale');
    var notice = document.getElementById('notice');

    function toggleQty() {
      if (!form || !form.regime) return;
      var fixed = form.regime.value === 'fixed';
      qtyWrap.style.display = fixed ? 'none' : 'block';
      form.quantity.required = !fixed;
    }
    if (form && form.regime) {
      form.regime.addEventListener('change', toggleQty);
      toggleQty();
    }

    function money(v) { return v ? Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : v; }
    function rate(v) { return v ? Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 6, maximumFractionDigits: 6 }) : v; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (error) { error.style.display = 'none'; }
      if (result) result.style.display = 'none';
      if (stale) stale.style.display = 'none';
      if (notice) notice.textContent = '';
      if (btn) { btn.disabled = true; btn.textContent = 'Calculando…'; }

      var body = {
        currency: form.currency.value,
        regime: form.regime.value,
        amount: form.amount.value,
        quantity: form.regime.value === 'fixed' ? null : form.quantity.value,
        spread_pct: form.spread_pct.value,
        iof_pct: form.iof_pct.value,
      };

      try {
        var res = await fetch('/v1/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          var data = await res.json();
          if (error) { error.textContent = (data.error && data.error.message) || 'Erro na simulação.'; error.style.display = 'block'; }
          return;
        }
        var data = await res.json();
        document.getElementById('r-gross-foreign').textContent = money(data.gross_foreign) + ' ' + data.currency;
        document.getElementById('r-gross-brl').textContent = 'R$ ' + money(data.gross_brl);
        document.getElementById('r-spread-brl').textContent = 'R$ ' + money(data.spread_brl) + ' (' + data.spread_pct + ' %)';
        document.getElementById('r-iof-brl').textContent = 'R$ ' + money(data.iof_brl) + ' (' + data.iof_pct + ' %)';
        document.getElementById('r-net-brl').textContent = 'R$ ' + money(data.net_brl);
        document.getElementById('r-effective-rate').textContent = rate(data.effective_rate);
        document.getElementById('r-source').textContent = (data.quote && data.quote.source) || '—';
        if (stale) {
          if (data.quote && data.quote.stale) {
            stale.textContent = 'Atenção: cotação com defasagem (última disponível no cache).';
            stale.style.display = 'block';
          } else { stale.style.display = 'none'; }
        }
        if (notice) notice.textContent = data.notice || '';
        if (result) result.style.display = 'block';
      } catch (err) {
        if (error) { error.textContent = 'Não foi possível conectar à API.'; error.style.display = 'block'; }
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Simular'; }
      }
    });
  })();
</script>
{% endblock %}
